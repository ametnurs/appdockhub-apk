name: Build AppDock Hub Release APK & PlayStore AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (Direct Install)
        run: flutter build apk --release

      - name: Build Release AppBundle AAB (Google Play Store)
        run: flutter build appbundle --release

      - name: Upload PlayStore AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOrbit-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppDockHub-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
